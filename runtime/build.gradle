plugins {
    id 'java-library'
}

def androidRuntimeSources = layout.buildDirectory.dir(
        'generated/sources/androidCompatible')

tasks.register('prepareAndroidCompatibleSources', Sync) {
    from '../src/main/java'
    into androidRuntimeSources
    filteringCharset = 'UTF-8'
    filesMatching('**/*.java') {
        filter { String line ->
            line.replace('import java.lang.System.Logger;',
                    'import toniarts.openkeeper.utils.Logger;')
                    .replace('import java.lang.System.Logger.Level;',
                            'import toniarts.openkeeper.utils.Logger.Level;')
                    .replace('System.getLogger(', 'Logger.getLogger(')
        }
    }
}

sourceSets {
    main {
        java.srcDirs = [androidRuntimeSources, 'src/main/java']
    }
}

dependencies {
    api "org.jmonkeyengine:jme3-core:$rootProject.jmonkeyengine_version"
    api "org.jmonkeyengine:jme3-plugins:$rootProject.jmonkeyengine_version"
    api "org.jmonkeyengine:jme3-effects:$rootProject.jmonkeyengine_version"
    api "org.jmonkeyengine:jme3-networking:$rootProject.jmonkeyengine_version"
    api "org.jmonkeyengine:jme3-niftygui:$rootProject.jmonkeyengine_version"

    implementation 'com.badlogicgames.gdx:gdx-ai:1.8.2'
    implementation 'javax.vecmath:vecmath:1.5.2'
    implementation 'com.simsilica:zay-es:1.6.0'
    implementation 'com.simsilica:zay-es-net:1.6.0'
    implementation 'com.simsilica:sio2:1.8.0'
    implementation 'com.simsilica:sim-ethereal:1.8.0'

    // These are compile-time only for legacy desktop launch/setup classes.
    // The Android application supplies jme3-android instead.
    compileOnly "org.jmonkeyengine:jme3-desktop:$rootProject.jmonkeyengine_version"
    compileOnly "org.jmonkeyengine:jme3-lwjgl3:$rootProject.jmonkeyengine_version"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('prepareAndroidCompatibleSources')
    options.release = 17
    options.compilerArgs += ['-proc:none', '-Xlint:deprecation']
}
